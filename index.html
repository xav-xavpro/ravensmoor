<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Murder at Ravensmoor Estate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#120f0a;--panel:#1d1811;--gold:#c9a84c;--gold2:#e8cf86;--cream:#efe5c8;--tan:#9a8060;--red:#8b1a1a;--line:rgba(201,168,76,.35);
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--cream);font-family:'EB Garamond',Georgia,serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;max-width:520px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding-top:var(--st);padding-bottom:var(--sb)}
.screen.on{display:flex;animation:fade .45s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif}
.btn{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:700;letter-spacing:.04em;color:#1a1208;background:linear-gradient(#e2c56e,#b8923a);border:none;border-radius:6px;padding:.75rem 1.4rem;box-shadow:0 3px 0 #6e5520,0 6px 18px rgba(0,0,0,.5);cursor:pointer}
.btn:disabled{opacity:.4;filter:grayscale(.6)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6e5520}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.icon-btn{background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--gold2);border-radius:8px;height:38px;min-width:38px;padding:0 .55rem;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:.25rem;cursor:pointer;font-family:'EB Garamond',serif}
.icon-btn:disabled{opacity:.35}

/* Titre */
#title{background:url(assets/manoir.jpg) center/cover;justify-content:flex-end;align-items:center;text-align:center}
#title::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(10,8,5,.92) 78%)}
#title .in{position:relative;padding:0 1.5rem 3.2rem}
.kicker{font-family:system-ui,sans-serif;font-size:.7rem;letter-spacing:.35em;color:var(--tan);text-transform:uppercase}
#title h1{font-size:2.6rem;line-height:1;color:var(--gold);font-style:italic;margin:.4rem 0 .2rem;text-shadow:0 2px 12px #000}
#title .sub{font-style:italic;color:var(--cream);opacity:.8;margin-bottom:1.8rem}

/* Intro */
#intro{background:radial-gradient(circle at 50% 20%,#2a2116,#0e0b07);padding:calc(var(--st) + 2rem) 1.6rem 2rem;justify-content:center;gap:1.4rem}
#intro p{font-size:1.18rem;line-height:1.55}
.paper{border:1px solid var(--line);border-radius:6px;padding:1.2rem;background:rgba(0,0,0,.25)}

/* Carte */
#map .top{display:flex;align-items:center;justify-content:space-between;padding:.6rem .8rem;border-bottom:1px solid var(--line);gap:.5rem}
#map .top h2{font-size:1.4rem;color:var(--gold);font-style:italic}
.prog{font-size:.95rem;color:var(--tan)}
.tabs{display:flex;gap:.4rem;padding:.5rem .8rem}
.tab{flex:1;text-align:center;padding:.45rem;border:1px solid var(--line);border-radius:6px;color:var(--tan);font-size:1rem}
.tab.on{background:rgba(201,168,76,.15);color:var(--gold2)}
#mapview{flex:1;position:relative;overflow:hidden;display:flex;justify-content:center;align-items:center}
#mapwrap{position:relative;height:100%;aspect-ratio:816/1456;max-width:100%}
#mapwrap img{width:100%;height:100%;display:block;border-radius:4px}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.pin .dot{width:34px;height:34px;border-radius:50%;background:#2a1d0c;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:0 2px 8px #000}
.pin .lab{margin-top:2px;font-size:.78rem;background:rgba(10,8,5,.85);padding:1px 6px;border-radius:4px;white-space:nowrap;color:var(--cream)}
.pin.locked .dot{border-color:#555;filter:grayscale(1);opacity:.75}
.pin.done .dot{background:#3b3010}
.pin.next .dot{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,207,134,.8)}50%{box-shadow:0 0 0 10px rgba(232,207,134,0)}}
#listview{flex:1;overflow:auto;padding:.3rem .8rem 1rem;display:none}
.rgroup{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:1.15rem;margin:.6rem 0 .3rem}
.ritem{display:flex;align-items:center;gap:.7rem;padding:.55rem .6rem;border:1px solid var(--line);border-radius:6px;margin-bottom:.4rem;background:rgba(0,0,0,.2);cursor:pointer}
.ritem img{width:44px;height:58px;object-fit:cover;border-radius:3px}
.ritem .nm{font-size:1.1rem}.ritem .st{font-size:.85rem;color:var(--tan)}
.ritem.locked{opacity:.45}
.mfoot{display:flex;gap:.5rem;padding:.6rem .8rem;border-top:1px solid var(--line)}
.mfoot .btn{flex:1;font-size:1.05rem;padding:.6rem}

/* Jeu */
#game .gh{display:flex;align-items:center;gap:.4rem;padding:.45rem .5rem;background:linear-gradient(#1d1811,#14110b);border-bottom:1px solid var(--line);z-index:5}
#game .gt{flex:1;min-width:0}
#game .gt .rn{font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#game .gt .rc{font-size:.85rem;color:var(--tan)}
#stage{flex:1;position:relative;overflow:hidden;background:#000;touch-action:none}
#scene{position:absolute;left:0;top:0;transform-origin:0 0}
#scene img{width:100%;height:100%;display:block;pointer-events:none}
#fx,#pat{position:absolute;inset:0;pointer-events:none}
#pat img{position:absolute;display:block}
#pat img.new{animation:vanish .6s ease .25s both}
@keyframes vanish{from{opacity:0}to{opacity:1}}
.mark{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(201,168,76,.85);color:#1a1208;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px rgba(255,220,120,.9);animation:pop .4s ease}
@keyframes pop{from{transform:scale(0)}70%{transform:scale(1.3)}to{transform:scale(1)}}
.ripple{position:absolute;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;border:4px solid #d24a3a;animation:rip .5s ease-out forwards}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.hintc{position:absolute;border-radius:50%;border:3px solid var(--gold2);box-shadow:0 0 18px var(--gold2),inset 0 0 18px var(--gold2);animation:hint 1s ease-in-out infinite}
@keyframes hint{50%{transform:scale(1.15);opacity:.6}}
.fly{position:fixed;z-index:50;pointer-events:none;border-radius:6px;background-repeat:no-repeat;box-shadow:0 0 0 2px var(--gold2),0 0 24px 6px rgba(255,215,110,.8);transition:transform .38s cubic-bezier(.2,1.4,.5,1)}
.spark{position:absolute;width:14px;height:14px;margin:-7px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 6px #ffd36b;pointer-events:none}
#objs{height:118px;overflow-y:auto;padding:.45rem .5rem calc(.45rem + var(--sb));display:flex;flex-wrap:wrap;gap:.3rem;align-content:flex-start;background:linear-gradient(#1a150e,#100d08);border-top:1px solid var(--line)}
.chip{font-size:.88rem;padding:.2rem .5rem;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.25);line-height:1.25}
.chip.found{color:var(--tan);text-decoration:line-through;opacity:.55;border-color:transparent}
.chip.flash{animation:chipf .7s ease}
@keyframes chipf{30%{background:var(--gold);color:#1a1208}}
#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);background:rgba(10,8,5,.9);border:1px solid var(--line);padding:.5rem 1rem;border-radius:8px;font-size:1rem;display:none;z-index:20;white-space:nowrap}

/* Overlays */
.ov{position:absolute;inset:0;z-index:40;display:none;background:rgba(5,4,2,.82);backdrop-filter:blur(2px);padding:calc(var(--st) + 1rem) 1.2rem calc(var(--sb) + 1rem);flex-direction:column;justify-content:center;align-items:center;text-align:center}
.ov.on{display:flex;animation:fade .35s ease}
.card{background:linear-gradient(#251d12,#17120b);border:1px solid var(--gold);border-radius:8px;padding:1.4rem 1.2rem;max-width:420px;width:100%;box-shadow:0 10px 40px #000}
.card h3{color:var(--gold);font-size:1.6rem;font-style:italic;margin:.2rem 0 .7rem}
.card p{font-size:1.12rem;line-height:1.5;margin-bottom:1.1rem}
.card .kicker{display:block}
#clue .card{animation:unfold .6s ease}
@keyframes unfold{from{transform:rotateX(70deg) scale(.8);opacity:0}to{transform:none;opacity:1}}

/* Scène personnage */
#talk{justify-content:flex-end;padding-bottom:calc(var(--sb) + 1rem)}
#talk .por{position:absolute;bottom:200px;width:62%;max-width:300px;border-radius:8px;border:2px solid var(--gold);box-shadow:0 10px 40px #000;transition:transform .5s cubic-bezier(.2,1,.3,1),opacity .5s}
#talk .por.l{left:6%;transform:translateX(-120%);opacity:0}
#talk .por.r{right:6%;transform:translateX(120%);opacity:0}
#talk .por.in{transform:none;opacity:1}
#talk .box{position:relative;width:100%;max-width:460px;min-height:170px;text-align:left;background:linear-gradient(#251d12,#17120b);border:1px solid var(--gold);border-radius:8px;padding:.9rem 1rem 1.6rem}
#talk .who{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:1.3rem;font-weight:700}
#talk .role{font-size:.85rem;color:var(--tan);margin-bottom:.4rem}
#talk .line{font-size:1.15rem;line-height:1.45;min-height:3.4em}
#talk .nxt{position:absolute;right:.8rem;bottom:.4rem;color:var(--gold2);font-size:.9rem;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}

/* Carnet / déduction */
#notebook .list,#deduce .list{flex:1;overflow:auto;padding:.6rem .9rem}
.note{border-left:3px solid var(--gold);padding:.3rem .7rem;margin-bottom:.8rem}
.note b{font-family:'Cormorant Garamond',serif;color:var(--gold2);font-size:1.1rem}
.note p{font-size:1.02rem;line-height:1.4}
.note.miss{opacity:.4;border-color:#555}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.sus{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#000;cursor:pointer;text-align:center}
.sus img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.sus div{padding:.3rem;font-size:.95rem}
.sus.sel{outline:3px solid var(--gold2)}
.hdr{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;border-bottom:1px solid var(--line)}
.hdr h2{flex:1;color:var(--gold);font-style:italic;font-size:1.45rem}
#verdict .card img{width:55%;border-radius:6px;border:2px solid var(--gold);margin-bottom:.6rem}
.quote{font-style:italic;color:var(--tan)}
#paywall .price{font-size:2rem;color:var(--gold2);font-family:'Cormorant Garamond',serif;font-weight:700;margin:.3rem 0 1rem}
.small{font-size:.85rem;color:var(--tan);margin-top:.8rem}
.wint{font-family:'Cormorant Garamond',serif;font-size:4.2rem;font-style:italic;font-weight:700;color:var(--gold2);text-shadow:0 0 30px rgba(255,210,110,.8),0 4px 0 #6e5520;animation:winIn 1s cubic-bezier(.2,1.6,.4,1) both}
.wins{font-size:1.35rem;color:var(--cream);margin-top:.6rem;animation:fade 1s ease .6s both;max-width:85%}
@keyframes winIn{from{transform:scale(.2) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.stars{color:var(--gold2);letter-spacing:.08em}
.stars .off{color:#4a3f2c}
#clueStars{font-size:2.4rem;margin:-.2rem 0 .3rem;letter-spacing:.15em}
#clueStars span{display:inline-block;opacity:0;transform:scale(.2)}
#clueStars span.go{animation:starIn .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes starIn{to{opacity:1;transform:none}}
#clueRule{font-size:.85rem;color:var(--tan);margin:-.4rem 0 .9rem}
#hdrStars{font-size:.8rem;margin-left:.35rem}
.plabel{font-size:1.05rem;color:var(--gold2)}
.pinput{font-family:'EB Garamond',serif;font-size:1.2rem;padding:.6rem .8rem;border-radius:6px;border:1px solid var(--gold);background:rgba(0,0,0,.35);color:var(--cream);width:100%}
#clueRank{font-size:1.02rem;color:var(--gold2);margin:-.3rem 0 .9rem;cursor:pointer;text-decoration:underline dotted}
#boardList{text-align:left;max-height:55vh;overflow:auto}
.brow{display:flex;gap:.6rem;align-items:baseline;padding:.35rem .4rem;border-bottom:1px solid rgba(201,168,76,.15);font-size:1.05rem}
.brow .rk{width:2.4rem;color:var(--tan);text-align:right}.brow .ps{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .sc{color:var(--gold2)}.brow .er{font-size:.8rem;color:var(--tan);width:3.6rem;text-align:right}
.brow.me{background:rgba(201,168,76,.18);border-radius:4px}
.bsep{text-align:center;color:var(--tan);padding:.1rem}
.row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app">

<section id="title" class="screen on"><div class="in">
  <div class="kicker" data-t="=kicker"></div>
  <h1><span data-t="=title1"></span><br><span data-t="=title2"></span></h1>
  <div class="sub" data-t="=sub"></div>
  <div class="row" id="titleBtns"></div>
</div></section>

<section id="intro" class="screen">
  <div class="kicker" data-t="yard"></div>
  <h2 style="color:var(--gold);font-size:2rem;font-style:italic" data-t="facts"></h2>
  <div class="paper"><p id="introText"></p></div>
  <label class="plabel" for="pseudo" data-t="pseudoLbl"></label>
  <input id="pseudo" class="pinput" maxlength="20" autocomplete="off">
  <button class="btn" onclick="G.afterIntro()" data-t="enter"></button>
</section>

<section id="map" class="screen">
  <div class="top"><h2 data-t="estate"></h2><span class="prog" id="prog"></span><button class="icon-btn" id="muteM" onclick="G.toggleMute()">🔊</button></div>
  <div class="tabs"><div class="tab on" id="tabMap" onclick="G.tab('map')" data-t="tabMap"></div><div class="tab" id="tabList" onclick="G.tab('list')" data-t="tabList"></div></div>
  <div id="mapview"><div id="mapwrap"><img src="assets/carte.jpg" alt="Plan"><div id="pins"></div></div></div>
  <div id="listview"></div>
  <div class="mfoot"><button class="btn ghost" onclick="G.openNotebook()" data-t="notebook"></button><button class="btn ghost" onclick="G.openBoard()" data-t="board"></button><button class="btn" id="accuseBtn" onclick="G.openDeduce()" data-t="accuse"></button></div>
</section>

<section id="game" class="screen">
  <div class="gh">
    <button class="icon-btn" onclick="G.backToMap()">←</button>
    <div class="gt"><div class="rn" id="rn"></div><div class="rc"><span id="rc"></span><span id="hdrStars" class="stars"></span></div></div>
    <button class="icon-btn" id="hintBtn" onclick="G.hint()">💡<span id="hintN">3</span></button>
    <button class="icon-btn" id="zoomBtn" onclick="G.toggleZoom()">🔍</button>
    <button class="icon-btn" id="muteG" onclick="G.toggleMute()">🔊</button>
  </div>
  <div id="stage"><div id="scene"><img id="sceneImg" alt=""><div id="pat"></div><div id="fx"></div></div><div id="toast"></div></div>
  <div id="objs"></div>
</section>

<section id="notebook" class="screen">
  <div class="hdr"><button class="icon-btn" onclick="G.show('map')">←</button><h2 data-t="nbTitle"></h2></div>
  <div class="list" id="nbList"></div>
</section>

<section id="deduce" class="screen">
  <div class="hdr"><button class="icon-btn" onclick="G.show('map')">←</button><h2 data-t="deduce"></h2></div>
  <div class="list"><p style="margin-bottom:.8rem;font-size:1.05rem" data-t="deduceTxt"></p><div class="sgrid" id="sgrid"></div></div>
  <div class="mfoot"><button class="btn" id="accuseGo" disabled onclick="G.accuse()" data-t="accuseGo"></button></div>
</section>

<section id="verdict" class="screen" style="justify-content:center;align-items:center;padding:1.2rem"><div class="card" id="vcard"></div></section>

<div class="ov" id="win" onclick="this.classList.remove('on')" style="background:rgba(5,4,2,.88)"><canvas id="winC" style="position:absolute;inset:0;width:100%;height:100%"></canvas><div class="wint" id="winT"></div><div class="wins" id="winS"></div></div>
<div class="ov" id="board" style="z-index:46"><div class="card"><span class="kicker" data-t="boardK"></span><h3 data-t="board"></h3><div id="boardList"></div><div class="row" style="margin-top:.8rem"><button class="btn ghost" onclick="G.closeOv('board')" data-t="close"></button></div></div></div>
<div class="ov" id="clue"><div class="card"><span class="kicker" data-t="clueFound"></span><div id="clueStars"></div><div id="clueRule"></div><div id="clueRank" onclick="G.openBoard()"></div><h3 id="clueT"></h3><p id="clueX"></p><button class="btn" onclick="G.clueNext()" data-t="cont"></button></div></div>

<div class="ov" id="talk" onclick="G.talkNext()"><img class="por l" id="por" alt=""><div class="box"><div class="who" id="who"></div><div class="role" id="role"></div><div class="line" id="tline"></div><div class="nxt" data-t="tap"></div></div></div>

<div class="ov" id="paywall"><div class="card">
  <span class="kicker" data-t="pwKicker"></span>
  <h3 data-t="pwTitle"></h3>
  <p data-t="pwText"></p>
  <div class="price" data-t="price"></div>
  <div class="row"><button class="btn" onclick="G.unlock()" data-t="unlockTest"></button><button class="btn ghost" onclick="G.closeOv('paywall')" data-t="later"></button></div>
  <p class="small" data-t="pwSmall"></p>
</div></div>

<div class="ov" id="room8"><div class="card" style="text-align:left"><h3 style="text-align:center" data-t="manor"></h3><div id="interiorList"></div><div class="row" style="margin-top:.6rem"><button class="btn ghost" onclick="G.closeOv('room8')" data-t="close"></button></div></div></div>

</div>

<script src="texts.js"></script>
<script src="objects.js"></script>
<script src="patches.js"></script>
<script>
(function(){
const W=816,H=1456, FREE=3, MIN_HIT=56;
// Musique : 6 morceaux en rotation sur les 14 lieux
const TRACK = i => (i % 6) + 1;
const PINS = {manoir:[.59,.13], remise:[.27,.11], rosiers:[.72,.27], potager:[.47,.46], kiosque:[.74,.55], hangar:[.13,.85], ponton:[.31,.89]};

const $=id=>document.getElementById(id);
let LG='fr';
function T(k,v){let t=LANGS[LG].ui[k]||k;if(v)for(const x in v)t=t.replace('{'+x+'}',v[x]);return t}
function setLang(l){LG=LANGS[l]?l:'fr';const L=LANGS[LG];document.documentElement.lang=LG;
  window.ROOMS=ROOM_IDS.map(id=>({id,name:L.rooms[id][0],t:L.rooms[id][1],clue:L.rooms[id][2],ext:!!EXT[id]}));
  window.CHARS={};for(const c in L.chars)CHARS[c]={name:L.chars[c][0],role:L.chars[c][1]};
  window.SCENES={};for(const k in L.scenes)SCENES[k]={c:SCENE_CHAR[k],l:L.scenes[k]};
  window.SUSPECTS=SUSPECT_IDS.map(id=>({id,why:L.why[id]||''}));
  window.INTRO_TEXT=L.intro;window.EPILOGUE={quote:L.epiQuote,text:L.epiText};
  for(const k in OBJECTS)OBJECTS[k].forEach((b,i)=>b.n=L.names[k][i]);
  document.title=L.title1+' '+L.title2;
  document.querySelectorAll('[data-t]').forEach(e=>{const k=e.dataset.t;e.textContent=k[0]==='='?L[k.slice(1)]:T(k)});
}
const store={get(){try{return JSON.parse(localStorage.getItem('rv1')||'null')}catch(e){return null}},set(v){try{localStorage.setItem('rv1',JSON.stringify(v))}catch(e){}},clear(){try{localStorage.removeItem('rv1')}catch(e){}}};
function fresh(){return {found:{},done:[],paid:false,hints:{},seen:[],muted:false,started:false,lang:(navigator.language||'fr').slice(0,2)==='fr'?'fr':'en'}}
let S=store.get()||fresh();
const save=()=>store.set(S);

/* ---------- Audio ---------- */
let AC=null, master=null, music={}, curTrack=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=S.muted?0:1;master.connect(AC.destination)}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
  return AC;
}
function getTrack(n){
  if(music[n])return music[n];
  const a=new Audio('assets/music/m'+n+'.mp3');a.loop=true;a.preload='auto';a.crossOrigin='anonymous';
  let g=null;
  try{const src=AC.createMediaElementSource(a);g=AC.createGain();g.gain.value=0;src.connect(g);g.connect(master)}catch(e){}
  music[n]={a,g};return music[n];
}
function playMusic(n,vol=.55){
  if(!ac())return; if(curTrack===n)return;
  const t=AC.currentTime, prev=curTrack;

function talk(key,done){
  const sc=SCENES[key];if(!sc){done&&done();return}
  TK={sc,i:0,done,side:Object.keys(SCENES).indexOf(key)%2?'r':'l'};
  const p=$('por');p.className='por '+TK.side;p.src='assets/chars/'+sc.c+'.jpg';
  $('who').textContent=CHARS[sc.c].name;$('role').textContent=CHARS[sc.c].role;$('tline').textContent='';
  openOv('talk');requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.add('in')));
  setTimeout(()=>typeLine(),350);
}
function typeLine(){
  const txt=TK.sc.l[TK.i],el=$('tline');el.textContent='';TK.typing=true;SFX.page();let n=0;
  clearInterval(TK.iv);TK.iv=setInterval(()=>{n+=2;el.textContent=txt.slice(0,n);if(n>=txt.length){clearInterval(TK.iv);TK.typing=false}},22);
}
function talkNext(){
  if(!TK)return;
  if(TK.typing){clearInterval(TK.iv);$('tline').textContent=TK.sc.l[TK.i];TK.typing=false;return}
  TK.i++;if(TK.i<TK.sc.l.length){typeLine();return}
  $('por').classList.remove('in');const d=TK.done;TK=null;setTimeout(()=>{closeOv('talk');d&&d()},300);
}

/* ---------- Carnet, déduction, verdict ---------- */
function openNotebook(){
  const l=$('nbList');l.innerHTML='';
  ROOMS.forEach(r=>{const d=isDone(r.id),n=document.createElement('div');n.className='note'+(d?'':' miss');n.innerHTML=`<b>${r.name} — ${d?r.t:'?'}</b><p>${d?r.clue:T('notFound')}</p>`;l.appendChild(n)});
  show('notebook');
}
let pick=null;
function openDeduce(){
  if(S.done.length<14){toast(T('missing',{n:14-S.done.length}));return}
  const g=$('sgrid');g.innerHTML='';pick=null;$('accuseGo').disabled=true;
  SUSPECTS.forEach(s=>{const c=document.createElement('div');c.className='sus';c.innerHTML=`<img src="assets/chars/${s.id}.jpg" alt=""><div>${CHARS[s.id].name}</div>`;
    c.onclick=()=>{pick=s.id;document.querySelectorAll('.sus').forEach(x=>x.classList.toggle('sel',x===c));$('accuseGo').disabled=false;SFX.page()};g.appendChild(c)});
  show('deduce');playMusic(4,.45);
}
function accuse(){
  const s=SUSPECTS.find(x=>x.id===pick),ok=pick==='harlow',v=$('vcard'),fem=LANGS[LG].fem.includes(pick);
  if(ok){v.innerHTML=`<span class="kicker">${T('solved')}</span><img src="assets/chars/harlow.jpg" alt=""><h3>${CHARS.harlow.name}</h3><p class="quote">${EPILOGUE.quote}</p><p>${EPILOGUE.text}</p><div class="row"><button class="btn" onclick="G.home()">${T('home')}</button></div>`;
    show('verdict');victory()}
  else{SFX.fail();v.innerHTML=`<span class="kicker">${T('wrong')}</span><img src="assets/chars/${pick}.jpg" alt=""><h3>${CHARS[pick].name} ${fem?T('innocentF'):T('innocentM')}</h3><p>${s.why}</p><div class="row"><button class="btn" onclick="G.openDeduce()">${T('retry')}</button><button class="btn ghost" onclick="G.openNotebook()">${T('notebook')}</button></div>`;show('verdict')}
}
function victory(){
  SFX.fanfare();const o=$('win');$('winT').textContent=T('bravo');$('winS').textContent=T('bravo2');o.classList.add('on');
  const c=$('winC'),x=c.getContext('2d'),W2=c.width=o.clientWidth*2,H2=c.height=o.clientHeight*2;
  const P=[...Array(160)].map(()=>({x:Math.random()*W2,y:-Math.random()*H2*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:4+Math.random()*7,a:Math.random()*6,va:(Math.random()-.5)*.3,c:['#e8cf86','#c9a84c','#fff3c4','#8b1a1a'][Math.floor(Math.random()*4)]}));
  let t0=performance.now();
  (function f(t){x.clearRect(0,0,W2,H2);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});
    if(t-t0<4200)requestAnimationFrame(f);else x.clearRect(0,0,W2,H2)})(t0);
  setTimeout(()=>o.classList.remove('on'),4300);
}
function unlock(){S.paid=true;save();SFX.unlock();closeOv('paywall');renderMap();toast(T('unlocked'))}
function home(){renderTitle();show('title')}

/* ---------- Init ---------- */
window.G={openBoard,show,afterIntro,tab,toggleMute,toggleZoom,hint,backToMap,clueNext,talkNext,openNotebook,openDeduce,accuse,unlock,closeOv,home};
const st=$('stage');
// pointeurs : 1 doigt = toucher / glisser, 2 doigts = pincement
const ptrs=new Map();let pinch=null;
st.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,pt(e));try{st.setPointerCapture(e.pointerId)}catch(_){}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:zoom};drag=null}else if(ptrs.size===1)onDown(e)});
st.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,pt(e));
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);setZoomAt(pinch.z*d/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2);e.preventDefault()}else if(!pinch)onMove(e)});
const endPtr=e=>{const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);if(pinch){if(ptrs.size===0)pinch=null;drag=null;return}if(had&&e.type==='pointerup')onUp(e);else drag=null};
st.addEventListener('pointerup',endPtr);st.addEventListener('pointercancel',endPtr);
st.addEventListener('wheel',e=>{e.preventDefault();const p=pt(e);setZoomAt(zoom*(e.deltaY<0?1.15:1/1.15),p.x,p.y)},{passive:false});
window.addEventListener('resize',()=>{if(R&&$('game').classList.contains('on'))layout()});
setLang(S.lang||'fr');renderTitle();
})();
</script>
